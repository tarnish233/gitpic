[package]
name = "gitpic"
version = "0.12.0"
edition = "2021"
# Verified, not guessed: `image 0.25.10` declares 1.88.0 and the `icu_*` crates
# reqwest pulls in declare 1.86, so this is the floor the dependency graph sets —
# and `cargo build --locked` was run on a 1.88.0 toolchain to confirm it. The CI
# `msrv` job reads this value back out of this file, so the two cannot drift.
# Only affects building from source; the Homebrew and release binaries are built
# by CI on stable.
rust-version = "1.88"
description = "Upload local/clipboard images to a GitHub repo (image host) and get a Markdown link"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tarnish233/gitpic"
homepage = "https://github.com/tarnish233/gitpic"
documentation = "https://github.com/tarnish233/gitpic"
authors = ["tarnish233"]
keywords = ["github", "image", "upload", "markdown", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "target/"]

[[bin]]
name = "gitpic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
owo-colors = { version = "4", features = ["supports-colors"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
