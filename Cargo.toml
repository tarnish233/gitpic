[package]
name = "gitpic"
version = "0.2.2"
edition = "2021"
description = "Upload local/clipboard images to a GitHub repo (image host) and get a Markdown link"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tarnish233/gitpic-cli"
homepage = "https://github.com/tarnish233/gitpic-cli"
documentation = "https://github.com/tarnish233/gitpic-cli"
authors = ["tarnish233"]
keywords = ["github", "image", "upload", "markdown", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "target/"]

[[bin]]
name = "gitpic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
owo-colors = { version = "4", features = ["supports-colors"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
