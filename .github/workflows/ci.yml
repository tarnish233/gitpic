name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  manifests:
    name: skill manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The skill ships through three vendor manifests that each repeat the
      # version and plugin name. Without this they drift silently.
      - name: Check skill manifests
        run: python3 .github/scripts/check_manifests.py

  test:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        # rustfmt's verdict is platform-independent, so once is enough.
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # No separate `cargo build`: clippy --all-targets type-checks the same
      # non-test cfg, and `cargo test` links a real executable, exercising every
      # native dependency on this platform.
      - name: Test
        run: cargo test
