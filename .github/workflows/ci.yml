name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  manifests:
    name: skill manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The skill ships through three vendor manifests that each repeat the
      # version and plugin name. Without this they drift silently.
      - name: Check skill manifests
        run: python3 .github/scripts/check_manifests.py

      # `release_notes` decides what a Release body is, for both the publisher and the
      # check above, so its own rules are worth exercising. A `--self-test` flag rather
      # than a test file because this repo has no Python test infrastructure at all —
      # the shape that actually runs beats the shape that is conventional.
      - name: Check the release-notes rules
        run: python3 .github/scripts/release_notes.py --self-test

  # Deliberately **not** a gate on the release path, unlike `test` — and the asymmetry
  # is worth writing down, because `release.yml` grew a `test` job of its own precisely
  # on the grounds that a tag cannot trigger this workflow. The same sentence would
  # seem to apply here, and does not.
  #
  # The difference is who consumes the promise. Publishing untested code ships a broken
  # binary. Publishing code whose dependency graph wants a newer rustc than
  # `rust-version` claims ships nothing wrong at all — `Cargo.toml` says as much
  # directly above the field: "Only affects building from source; the release binaries
  # and the copy embedded in GitPic.app are built by CI on stable." Checked, rather than
  # assumed: `gitpic` is not on crates.io, so `cargo install gitpic` is not a consumer,
  # and no distribution channel compiles the crate — the DMG carries a binary CI built.
  # The only consumer is somebody who clones and builds, who finds out in the first
  # second and can raise the floor.
  #
  # So putting this on `publish`'s `needs` would trade five perfectly good prebuilt
  # artifacts for a refusal to release — and the floor is already flush, since the note
  # in `Cargo.toml` records `image 0.25.10` declaring 1.88.0. One `cargo update` would
  # be enough. Failing here, on main, makes the answer a commit instead of an
  # unshippable tag.
  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Read the version out of Cargo.toml rather than repeating it here. A
      # hardcoded toolchain in this file would drift from the very promise this
      # job exists to check — the same trap `check_manifests.py` closes for the
      # plugin manifests.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[[^p]/p' Cargo.toml \
            | sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            | head -1)"
          if [[ -z "$version" ]]; then
            echo "Cargo.toml [package] declares no rust-version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      # What is promised is that `cargo install` works on this toolchain, and that
      # does not build tests — so neither does this. cargo refuses the build itself
      # if a dependency needs a newer rustc than we claim, which is the drift that
      # actually happens: `cargo update` raises a dependency's floor above ours.
      - name: Build
        run: cargo build --locked

  test:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        # rustfmt's verdict is platform-independent, so once is enough.
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # No separate `cargo build`: clippy --all-targets type-checks the same
      # non-test cfg, and `cargo test` links a real executable, exercising every
      # native dependency on this platform.
      - name: Test
        run: cargo test

  app:
    name: GitPic.app builds and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        working-directory: apps/GitPic
        run: swift build

      # The bundle path, not just the Swift package.
      #
      # This job used to stop at `swift build` / `swift test`, so the bundle, the
      # icon compile, the signing, and the version stamping were only ever
      # exercised by a tag. That gap is not theoretical: after the icon moved to
      # `actool`, a release guard still looking for `Resources/GitPic.icns` stayed
      # green in CI and would have failed at the one moment it mattered.
      #
      # It also re-checks the unified version for free — build-app.sh refuses to
      # embed a `gitpic` whose `--version` disagrees with Cargo.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the app bundle
        run: ./scripts/build-app.sh

      # Offline suites only. The live suite is gated behind GITPIC_LIVE because it
      # uploads to a real repository and needs a gitpic credential (`auth.toml`, from
      # `gitpic auth login`).
      #
      # After the bundle on purpose, and this ordering is load-bearing:
      # `FinderServicePlistTests` reads `dist-app/GitPic.app/Contents/Info.plist` and
      # disables itself when there is no bundle to read. Run before `build-app.sh` — as
      # it was — the one check that holds the `NSServices` plist and the Swift that
      # registers it to the same names silently skipped on every CI run, which is the
      # single outcome that suite exists to prevent. `dist-app/` is gitignored, so a
      # fresh checkout never has one by accident.
      - name: Test
        working-directory: apps/GitPic
        run: swift test

      - name: The bundle carries the Cargo.toml version and a complete icon
        run: |
          set -euo pipefail
          plist=dist-app/GitPic.app/Contents/Info.plist
          want="$(awk '
            /^\[package\]/ { inpkg = 1; next }
            /^\[/          { inpkg = 0 }
            inpkg && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, ""); print; exit
            }' Cargo.toml)"
          echo "Cargo.toml version: $want"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$want"
          # The embedded CLI's own version, read back out of the bundle rather than
          # taken from the build's intent.
          test "$(plutil -extract GitPicEmbeddedCLIVersion raw "$plist")" = "$want"
          test -s dist-app/GitPic.app/Contents/Resources/AppIcon.icns
          test -s dist-app/GitPic.app/Contents/Resources/Assets.car
          test -x dist-app/GitPic.app/Contents/Resources/gitpic
