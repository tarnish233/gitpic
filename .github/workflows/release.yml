# Release gitpic — the CLI and GitPic.app, one version, one Release.
#
# Both used to have their own workflow and their own version file. They are now
# unified, and three constraints keep that honest:
#
#  1. `Cargo.toml`'s `[package] version` is the only version. The `version` job
#     reads it and, on a tag build, asserts the tag is exactly `v<that version>`.
#     `scripts/build-app.sh` reads the same field and asserts the `gitpic` binary
#     it embeds reports that version too.
#  2. One publisher. Four matrix jobs each calling action-gh-release used to race
#     on the same tag's Release; see the comment above `publish`. The app job
#     therefore builds and verifies, then hands its zip over as an artifact
#     instead of publishing anything itself.
#  3. This is a **normal release, never a prerelease**, even though the app is
#     ad-hoc signed and not notarised. `repos/.../releases/latest` skips
#     prereleases, and the Homebrew tap's updater polls exactly that endpoint on a
#     cron that does not fail — so a prerelease flag here would stop the formula
#     updating, silently and indefinitely. The notarisation caveat lives in the
#     release notes instead, next to the app asset.
name: Release

on:
  push:
    tags: ["v*"]
  # Build and verify everything without publishing. There was no non-tag entry
  # point for the CLI side before, which meant the only way to find out whether a
  # release would build was to tag one.
  workflow_dispatch:

# Only the publishing job writes to the repository; every build job gets a
# read-only token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One place resolves the version, so no job re-derives it and drifts.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Cargo.toml and check the tag agrees
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # Only the [package] section: `version = ` also appears under
          # [dependencies.*] tables, and a whole-file match would take whichever
          # came first. Same parse as check_manifests.py and build-app.sh.
          version="$(awk '
            /^\[package\]/ { inpkg = 1; next }
            /^\[/          { inpkg = 0 }
            inpkg && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, ""); print; exit
            }' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "no [package] version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"
          # The CLI side never checked this: it derived the version from the tag
          # and compared it to nothing, so a tag could disagree with Cargo.toml and
          # publish anyway. The app side did check, and this keeps the stricter half.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag: $GITHUB_REF_NAME expected: v$version"
            test "$GITHUB_REF_NAME" = "v$version"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/gitpic"
          tar -C "$(dirname "$bin")" -czf "gitpic-${{ matrix.target }}.tar.gz" gitpic
          shasum -a 256 "gitpic-${{ matrix.target }}.tar.gz" > "gitpic-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/gitpic.exe"
          $zip = "gitpic-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $zip
          # Match `shasum -a 256` byte for byte, so this sidecar is verifiable with
          # the same command as the unix ones: lowercase hash, two spaces, bare
          # filename, LF, no BOM. `(Get-FileHash).Hash | Out-File` produced an
          # uppercase hash with no filename, which `shasum -c` cannot read at all.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")

      # A checksum sidecar is only worth publishing if it actually verifies.
      # Runs on every platform through bash (Git Bash on the Windows runner), so
      # the Windows sidecar's format is checked by the same tool that consumes it
      # — which is not something a maintainer on macOS can test locally.
      - name: Verify checksum sidecars
        shell: bash
        run: |
          set -euo pipefail
          files=( gitpic-${{ matrix.target }}.*.sha256 )
          echo "sidecars: ${files[*]}"
          for f in "${files[@]}"; do
            if command -v shasum >/dev/null 2>&1; then shasum -a 256 -c "$f"
            else sha256sum -c "$f"; fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: gitpic-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 1

  # GitPic.app. Builds and verifies here, publishes nowhere: the zip travels to
  # `publish` as an artifact so there is still exactly one publisher.
  #
  # Must stay on macOS — `hdiutil`, `codesign`, `plutil`, and `actool` are all
  # required, and the embedded CLI has to be a native build.
  app:
    name: Build GitPic.app
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the CLI that gets embedded
        run: cargo build --release --locked

      # This also re-checks the unified version: the script fails if the binary it
      # is about to embed does not report the Cargo.toml version.
      - name: Build the app bundle
        run: ./scripts/build-app.sh

      # After the bundle, and the order is load-bearing: `FinderServicePlistTests`
      # reads `dist-app/GitPic.app/Contents/Info.plist` and disables itself when there
      # is none, so running this first — as it did — silently skipped the one check
      # that holds the `NSServices` plist and the Swift that registers it to the same
      # names, on every release.
      #
      # GITPIC_LIVE is intentionally unset: the live suite uploads to a real
      # repository and needs a gitpic credential (`auth.toml`), neither of which
      # belongs in CI.
      - name: Swift tests (offline only)
        working-directory: apps/GitPic
        run: swift test

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="GitPic-${VERSION}-macos-arm64"
          # A dmg, not a zip. The staging directory is what makes it worth being one:
          # a symlink to /Applications beside the app turns opening the disk image into
          # the drag-across everyone already knows, which a zip cannot offer.
          #
          # UDZO because the image is a download; it compresses about as well as the
          # zip did. `-ov` so a re-run in the same workspace overwrites rather than
          # failing on an existing image.
          rm -rf dmgroot && mkdir dmgroot
          cp -R dist-app/GitPic.app dmgroot/GitPic.app
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "GitPic" -srcfolder dmgroot \
            -ov -format UDZO "dist-app/${name}.dmg"
          ( cd dist-app && shasum -a 256 "${name}.dmg" > "${name}.dmg.sha256" )
          echo "asset=$name.dmg" >> "$GITHUB_OUTPUT"
          # The bundle must carry the version this job was told to build, not
          # whatever happened to be on disk.
          got="$(plutil -extract CFBundleShortVersionString raw dist-app/GitPic.app/Contents/Info.plist)"
          echo "bundle version: $got expected: $VERSION"
          test "$got" = "$VERSION"

      - name: Verify the packaged app
        run: |
          set -euo pipefail
          cd dist-app
          shasum -c "${{ steps.package.outputs.asset }}.sha256"
          # Mounted read-only and asserted in place, rather than extracted: what ships
          # is the image, so the image is what has to be checked. `-nobrowse` keeps it
          # out of the Finder sidebar, and the trap detaches it however this step ends
          # — a leaked mount would make a re-run fail on the volume name.
          mnt="$(mktemp -d)"
          hdiutil attach "${{ steps.package.outputs.asset }}" \
            -mountpoint "$mnt" -nobrowse -readonly
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/GitPic.app"
          # The alias is the reason this is a dmg at all; a build that lost it would
          # still install fine by hand and would silently stop being a drag-across.
          test -L "$mnt/Applications"
          test -x "$app/Contents/MacOS/GitPic"
          # The embedded CLI is the whole reason a Finder-launched app works.
          test -x "$app/Contents/Resources/gitpic"
          # Both halves of what actool emits, because they serve different macOS
          # versions: Assets.car carries every Tahoe appearance, the icns is the
          # flattened fallback for macOS 14-25. A build that dropped either would
          # still launch and would still show *an* icon, so only an assertion
          # catches it.
          test -s "$app/Contents/Resources/AppIcon.icns"
          test -s "$app/Contents/Resources/Assets.car"
          "$app/Contents/Resources/gitpic" --version
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          # CFBundleIconName resolves the Assets.car icon; CFBundleIconFile is what
          # older macOS reads. Both, or the icon silently falls back to the generic
          # executable one on one OS or the other.
          test "$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")" = "AppIcon"
          test "$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")" = "AppIcon"

      # Deliberately NOT named `dist-*`: `publish` downloads that pattern with
      # `merge-multiple: true` into `dist/`, so an artifact called `dist-app` would
      # be poured in beside the CLI archives and confuse every guard downstream.
      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            dist-app/${{ steps.package.outputs.asset }}
            dist-app/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  # A single job creates the Release and uploads every artifact at once.
  #
  # Previously each of the four matrix jobs called action-gh-release itself, so
  # four jobs raced to create the same tag's Release: whichever lost could fail
  # with "already_exists", and the release body was written four times over. One
  # publisher also means the Release either has every platform and the app, or
  # does not exist — it can no longer appear half-populated while other builds are
  # still running.
  publish:
    name: Publish release
    needs: [version, build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare release title and changelog
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # Stops at the `release-notes-end` marker as well as at the next version
          # heading, and that marker is the whole point: the changelog section keeps the
          # full detail — what was measured, which design was rejected — while a Release
          # is read by someone deciding whether to upgrade. Those are different documents,
          # and this is where they part. What lands here is also what GitPic.app renders
          # in its update sheet, so the two things a user might read stay identical by
          # construction rather than by being written twice.
          #
          # A section with no marker yields the whole thing, which is what every release
          # before 0.19.0 did and is what keeps backfilling an old tag working.
          # `check_manifests.py` requires the marker for the version being *cut*, so
          # forgetting it fails CI instead of quietly publishing the long version.
          if ! awk -v version="$version" '
            BEGIN { heading = "## [" version "]" }
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "release-notes-end") { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.zh-CN.md > RELEASE_NOTES.md; then
            echo "No changelog section found for ${version}" >&2
            exit 1
          fi
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "Changelog section for ${version} is empty" >&2
            exit 1
          fi
          subtitle="$(awk '/^### / { sub(/^### /, ""); print; exit }' RELEASE_NOTES.md)"
          # The subtitle is the first `### ` heading, which is only a *theme* when
          # the changelog author wrote one before the Keep a Changelog categories.
          # When they did not, the public title became "gitpic v0.4.0 — 变更" —
          # a category label saying nothing about the release. Same rule this
          # project applies everywhere else: input that cannot mean what it is
          # being used for is an error, not a silently wrong default.
          case "$subtitle" in
            Added|Changed|Deprecated|Removed|Fixed|Security|Performance|Documentation|Testing|Packaging|CI|\
            CLI|App|新增|变更|弃用|移除|修复|安全|性能|文档|测试|打包|发布方式|本版未包含)
              echo "The first '### ' heading in the ${version} changelog section is the category" >&2
              echo "'${subtitle}', which would become the public release title. Add a theme line" >&2
              echo "(a one-line '### <what this release is about>') above the categories." >&2
              exit 1
              ;;
          esac
          if [[ -z "$subtitle" ]]; then
            echo "The ${version} changelog section has no '### ' heading to use as a subtitle" >&2
            exit 1
          fi
          echo "name=gitpic v${version} — ${subtitle}" >> "$GITHUB_OUTPUT"

          # The app ships in this release too, and it is not notarised. Stated
          # here, next to its asset, rather than encoded in a prerelease flag the
          # Homebrew tap's updater would trip over (see the header comment).
          cat >> RELEASE_NOTES.md <<'NOTES'

          ## GitPic.app

          `GitPic-<version>-macos-arm64.dmg` in this release is the macOS menu-bar
          app, same version as the CLI and with that CLI embedded. Open it and drag
          GitPic across to Applications.

          It is ad-hoc signed and **not notarised**, so macOS refuses to open it
          after download until you clear the quarantine flag:

          ```sh
          xattr -dr com.apple.quarantine /Applications/GitPic.app
          ```

          Apple Silicon only. Authorise with `gitpic auth login` — or in the app,
          设置 ▸ 图床 ▸ 使用 GitHub 登录.
          NOTES

      - name: Download the CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Download the app bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: dist-app

      # Guards against publishing a partial set. Every expected file is named
      # explicitly rather than counted through a glob: with both artifact families
      # in play, `ls gitpic-*` also matches `GitPic-…dmg` on any case-insensitive
      # filesystem, so the old `-eq 4` count was correct only by virtue of this job
      # running on Linux. Each sidecar is re-verified against the bytes that will
      # actually be uploaded rather than the ones a build job had on disk.
      - name: Verify the full artifact set
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist dist-app
          expected=(
            dist/gitpic-aarch64-apple-darwin.tar.gz
            dist/gitpic-x86_64-apple-darwin.tar.gz
            dist/gitpic-x86_64-unknown-linux-gnu.tar.gz
            dist/gitpic-x86_64-pc-windows-msvc.zip
            "dist-app/GitPic-${VERSION}-macos-arm64.dmg"
          )
          for archive in "${expected[@]}"; do
            test -s "$archive"
            test -s "$archive.sha256"
            ( cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256" )
          done
          # Nothing beyond the expected set may reach the upload, in either
          # directory — an unexpected file here means a build job changed its
          # output and this list was not updated with it.
          found=$(find dist dist-app -maxdepth 1 -type f | wc -l | tr -d ' ')
          echo "files=$found expected=$(( ${#expected[@]} * 2 ))"
          test "$found" -eq "$(( ${#expected[@]} * 2 ))"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_notes.outputs.name }}
          body_path: RELEASE_NOTES.md
          # Never `prerelease: true` — see constraint 3 in the header comment.
          files: |
            dist/gitpic-*
            dist-app/GitPic-*
          fail_on_unmatched_files: true

      # Tell the tap now, instead of leaving it to notice.
      #
      # The tap finds out by polling `releases/latest` on a six-hourly cron, so a
      # release was real but not yet installable for up to six hours — measured the
      # hard way: 0.13.0 was published at 05:17Z while the tap still pinned 0.11.5,
      # and `brew upgrade` had nothing to offer. This makes it seconds.
      #
      # **The cron on the tap stays.** This is the fast path, not the only path: a
      # missing secret, an expired token or a GitHub hiccup drops back to the poll
      # rather than leaving the tap stuck. That is also why `continue-on-error` is
      # here — by the time this step runs the release is already published, and
      # failing the job would mark a perfectly good release as failed for something
      # the cron will fix on its own.
      #
      # `GITHUB_TOKEN` cannot do this: its scope is this repository. A cross-repo
      # dispatch needs write access to the tap, which is what TAP_DISPATCH_TOKEN is
      # for.
      #
      # The "nobody has set the token" case is checked **in the script, not in `if:`**.
      # The obvious spelling — `if: secrets.TAP_DISPATCH_TOKEN != ''` — is not merely
      # discouraged, it does not parse: the `secrets` context is not among those
      # available to a step's `if`, and GitHub rejects the whole workflow file for it,
      # producing a zero-second failed run named after the file with no jobs in it.
      # Measured the hard way — it took this workflow down on `main` until it was fixed.
      # Mapping the secret into a job-level `env` would satisfy `if:` but hands the
      # token to every other step in the job, which is worse than a two-line check.
      #
      # The version travels with the event, and the tap asserts it matches what
      # `releases/latest` tells it. Publishing and `latest` moving are not atomic, so
      # a tap that read one second too early would pin the *previous* version and
      # then sit on it until the next cron — a silent wrong answer, which is the one
      # outcome worth failing loudly over.
      - name: Tell the tap a release landed
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_DISPATCH_TOKEN is not set; leaving the tap to its cron." >&2
            exit 0
          fi
          # `--input -` with real JSON rather than `-f client_payload[version]=…`,
          # so the nesting is unambiguous and the version is never shell-interpolated
          # into a URL or a query string.
          printf '{"event_type":"gitpic-released","client_payload":{"version":"%s"}}' \
            "$VERSION" | gh api repos/tarnish233/homebrew-tap/dispatches --input -
          echo "dispatched gitpic-released for $VERSION"
